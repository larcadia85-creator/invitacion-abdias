<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0788c9">

<title>¡Abdías cumple 6 años!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #073b65;
  background: linear-gradient(
    180deg,
    #05c7ed 0%,
    #0788c9 60%,
    #f5d99b 100%
  );
  overflow-x: hidden;
}

/* BURBUJAS */
.bubbles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 5;
}

.bubble {
  position: absolute;
  bottom: -70px;
  border: 2px solid #ffffffbb;
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 25%,
    #fff,
    #b9f4ff55 55%,
    #ffffff22
  );
  box-shadow: inset -3px -4px 8px #ffffff55;
  animation: subir linear infinite;
}

@keyframes subir {
  0% {
    transform: translateY(0) translateX(0);
    opacity: 0;
  }
  10% { opacity: .85; }
  90% { opacity: .75; }
  100% {
    transform: translateY(-120vh) translateX(35px);
    opacity: 0;
  }
}

/* FONDO DE ARENA */
.seafloor {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 65px;
  background: linear-gradient(#ffe8ae, #e8bb6d);
  clip-path: polygon(
    0 35%, 20% 10%, 40% 35%, 60% 8%,
    80% 30%, 100% 12%, 100% 100%, 0 100%
  );
  z-index: 0;
  pointer-events: none;
}

.coral {
  position: fixed;
  bottom: 3px;
  font-size: 32px;
  z-index: 1;
  pointer-events: none;
}

.coral.left { left: 5px; }
.coral.right { right: 5px; }

/* BOTÓN DE MÚSICA */
.boton-musica {
  position: fixed;
  right: 12px;
  bottom: 14px;
  z-index: 20;
  max-width: calc(100vw - 24px);
  padding: 12px 16px;
  border: 3px solid white;
  border-radius: 30px;
  background: #ffca28;
  color: #064878;
  font-family: 'Luckiest Guy', cursive;
  font-size: 13px;
  box-shadow: 0 4px 0 #07558b;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.boton-musica:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #07558b;
}

/* PÁGINA */
.scene {
  position: relative;
  z-index: 2;
  padding: 18px 12px 42px;
}

/* TARJETA */
.card {
  position: relative;
  isolation: isolate;
  width: min(100%, 570px);
  margin: auto;
  padding: 15px 15px 0;
  border: 5px solid #ffca28;
  border-radius: 28px;
  background: #fffdf0;
  box-shadow: 0 10px 0 #07558b65;
  overflow: hidden;
}

/* CONTENIDO */
.contenido {
  position: relative;
  z-index: 2;
}

/* PORTADA */
.portada {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: 0 auto 12px;
  overflow: hidden;
  border-radius: 16px;
  line-height: 0;
}

.portada img {
  display: block;
  width: 100%;
  height: auto;
}

.portada-nombre {
  position: absolute;
  top: 69%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 95%;
  color: #ffdf24;
  font-family: 'Luckiest Guy', cursive;
  font-size: clamp(38px, 10vw, 66px);
  line-height: 1.1;
  -webkit-text-stroke: 2px #07558b;
  text-shadow: 3px 4px 0 #07558b, 5px 6px 0 #063657;
  white-space: nowrap;
  pointer-events: none;
}

/* ETIQUETA */
.label {
  display: inline-block;
  max-width: 100%;
  padding: 7px 10px;
  border: 2px solid #8bdff7;
  border-radius: 25px;
  background: #dff8ff;
  color: #07558b;
  font-family: 'Bangers', cursive;
  font-size: 18px;
}

.pineapple {
  margin: 5px 0;
  font-size: 32px;
  animation: flotar 2.5s ease-in-out infinite;
}

@keyframes flotar {
  50% {
    transform: translateY(-5px) rotate(2deg);
  }
}

/* TITULARES */
h1 {
  margin: 9px 0;
  font-family: 'Luckiest Guy', cursive;
  font-size: clamp(32px, 8vw, 43px);
  line-height: 1.08;
  color: #ffdf24;
  -webkit-text-stroke: 1.2px #07558b;
  text-shadow: 3px 4px 0 #07558b;
}

.name {
  font-family: 'Luckiest Guy', cursive;
  font-size: clamp(25px, 6vw, 35px);
  line-height: 1.2;
  color: #ffce25;
  -webkit-text-stroke: 1px #07558b;
  text-shadow: 2px 3px 0 #07558b;
  overflow-wrap: anywhere;
}

.note {
  margin: 8px auto;
  font-family: 'Bangers', cursive;
  font-size: 17px;
  letter-spacing: .2px;
  line-height: 1.3;
}

/* NÚMERO 6 */
.numero-bob {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 4px auto 8px;
}

.numero-bob img {
  display: block;
  width: 125px;
  max-width: 43%;
  height: auto;
  object-fit: contain;
  background: transparent;
  filter: drop-shadow(0 4px 3px #07558b25);
  animation: flotar 2.5s ease-in-out infinite;
}

/* INFORMACIÓN */
.details {
  position: relative;
  z-index: 2;
  margin-top: 5px;
  padding: 7px 9px;
  border: 2px dashed #6bcbe9;
  border-radius: 18px;
  background: #e2f7ff;
  font-family: 'Bangers', cursive;
  font-size: 18px;
  letter-spacing: .2px;
}

.detail {
  margin: 7px 0;
  line-height: 1.25;
}

.detail strong {
  display: block;
  color: #087bc1;
  font-size: 21px;
}

/* BOTONES */
.button {
  display: block;
  width: 85%;
  max-width: 285px;
  margin: 11px auto 0;
  padding: 11px 8px;
  border: 0;
  border-radius: 15px;
  background: #087bc1;
  color: white;
  text-decoration: none;
  font-family: 'Luckiest Guy', cursive;
  font-size: 14px;
  line-height: 1.3;
  box-shadow: 0 4px #07558b;
  transition: transform .2s;
}

.button:hover {
  transform: translateY(-2px);
}

.button.yellow {
  background: #ffca28;
  color: #073b65;
  box-shadow: 0 4px #d99a00;
}

/* MENSAJE */
.frase-final {
  max-width: 320px;
  margin: 10px auto 0;
  font-size: 15px;
  line-height: 1.3;
}

/* CONFIRMACIÓN */

  max-width: 240px;

  }
